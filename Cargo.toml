[package]
name = "casc-extractor"
version = "0.1.0"
edition = "2021"
authors = ["Karl Wallbom <kalleeh@users.noreply.github.com>"]
description = "Extract sprites from Blizzard CASC archives with Unity integration"
license = "MIT"
repository = "https://github.com/kalleeh/blizzard-casc-extractor"
keywords = ["blizzard", "casc", "sprite", "extraction", "starcraft"]
categories = ["command-line-utilities", "game-development"]
readme = "README.md"

[[bin]]
name = "casc-extractor"
path = "src/main.rs"

[[bench]]
name = "extraction"
harness = false


[dependencies]
# CLI and argument parsing
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"

# Progress reporting
indicatif = "0.18"

# Image processing
# Only the codecs this tool actually reads/writes. Default features drag in AVIF
# encoders (ravif/rav1e), which took the release build from ~50s to ~8min.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ddsfile = "0.6"
texture2ddecoder = "0.1"
png = "0.18"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"
anyhow = "1.0"

# Binary data handling
byteorder = "1.5"

# MPQ archive reading (for .scm/.scx map files)
mpq = "0.8.1"

# Compression libraries for BLTE decompression
flate2 = "1.0"  # ZLIB/DEFLATE compression
lz4_flex = "0.11"  # LZ4 compression for ANIM texture decompression

# Cryptographic hashing for validation
sha2 = "0.10"  # SHA256 hashing for byte-level comparison

# Parallelism
rayon = "1.10"

# Logging
env_logger = "0.11"
log = "0.4"

# System information
dirs = "6"

[dev-dependencies]
# Property-based testing
proptest = "1.4"

# Temporary directories for tests
tempfile = "3.10"

# Filesystem assertions
assert_fs = "1.1"

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

# Test coverage (optional - only available on Linux)
# tarpaulin = "0.27"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Keep the symbol table so a panic in the binary-format parsers yields a
# usable backtrace; debug info is still dropped. Overflow checks are on
# because every offset/size here comes from untrusted file headers, where a
# silently wrapped multiply turns a clean error into a bogus allocation.
strip = "debuginfo"
overflow-checks = true

# Development profile for faster builds
[profile.dev]
opt-level = 0
debug = true
overflow-checks = true
