name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            lib_name: libcasc.dylib
            lib_path_var: DYLD_LIBRARY_PATH
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            lib_name: libcasc.so
            lib_path_var: LD_LIBRARY_PATH

    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Build libcasc
        run: |
          git clone --depth=1 https://github.com/ladislav-zezula/CascLib /tmp/CascLib
          cmake -S /tmp/CascLib -B /tmp/CascLib/build \
            -DCASC_BUILD_SHARED_LIB=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build /tmp/CascLib/build --parallel
          mkdir -p lib
          if [ "${{ runner.os }}" = "macOS" ]; then
            # On macOS CascLib builds a framework (casc.framework/casc), not a flat
            # dylib. Mirror the layout build.rs links against: the framework binary
            # at the versioned path matching its @rpath install name, plus a
            # libcasc.dylib symlink so `-lcasc` resolves at link time.
            mkdir -p lib/casc.framework/Versions/1.0.0
            cp /tmp/CascLib/build/casc.framework/casc lib/casc.framework/Versions/1.0.0/casc
            ln -sf casc.framework/Versions/1.0.0/casc lib/libcasc.dylib
          else
            cp /tmp/CascLib/build/${{ matrix.lib_name }} lib/
          fi

      - name: Build release binary
        env:
          ${{ matrix.lib_path_var }}: lib
        run: cargo build --release --target ${{ matrix.target }}

      # Ship the native library alongside the binary. Publishing the bare
      # executable produced a release that could not even run --version, because
      # libcasc is a hard runtime dependency and the in-tree rpaths
      # (@loader_path/../../lib) only resolve from target/<profile>/.
      - name: Package archive
        env:
          VERSION: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          STAGE="casc-extractor-${VERSION}-${TARGET}"
          mkdir -p "${STAGE}/lib"
          cp "target/${TARGET}/release/casc-extractor" "${STAGE}/"
          cp README.md CHANGELOG.md LICENSE "${STAGE}/" 2>/dev/null || true

          if [ "${{ runner.os }}" = "macOS" ]; then
            mkdir -p "${STAGE}/lib/casc.framework/Versions/1.0.0"
            cp lib/casc.framework/Versions/1.0.0/casc \
               "${STAGE}/lib/casc.framework/Versions/1.0.0/casc"
            # .cargo/config.toml already links in @executable_path/lib, which makes
            # this layout self-contained. Add it only if that ever stops being true
            # (a duplicate LC_RPATH is a hard error, so tolerate the failure).
            if ! otool -l "${STAGE}/casc-extractor" | grep -q "@executable_path/lib"; then
              install_name_tool -add_rpath "@executable_path/lib" "${STAGE}/casc-extractor"
              codesign --remove-signature "${STAGE}/casc-extractor" 2>/dev/null || true
              codesign -s - "${STAGE}/casc-extractor" 2>/dev/null || true
            fi
          else
            cp "lib/${{ matrix.lib_name }}" "${STAGE}/lib/"
            patchelf --set-rpath '$ORIGIN/lib' "${STAGE}/casc-extractor" \
              || echo "patchelf unavailable; LD_LIBRARY_PATH=lib may be required"
          fi

          # Verify the packaged layout actually runs before publishing it.
          ( cd "${STAGE}" && ./casc-extractor --version )

          tar czf "${STAGE}.tar.gz" "${STAGE}"

      - uses: actions/upload-artifact@v4
        with:
          name: casc-extractor-${{ github.ref_name }}-${{ matrix.target }}
          path: casc-extractor-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: true
          body: |
            ## Installation

            Download the archive for your platform, unpack it, and run the binary.
            The bundled `lib/` directory contains CascLib, and the executable
            resolves it relatively — no environment variables needed.

            ```bash
            tar xzf casc-extractor-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz
            cd casc-extractor-${{ github.ref_name }}-aarch64-apple-darwin
            ./casc-extractor inspect archive
            ```

            To put it on your PATH, move the whole directory somewhere stable and
            symlink the binary (the symlink is followed, so `lib/` is still found):

            ```bash
            sudo mv casc-extractor-${{ github.ref_name }}-aarch64-apple-darwin /usr/local/opt/casc-extractor
            sudo ln -sf /usr/local/opt/casc-extractor/casc-extractor /usr/local/bin/casc-extractor
            ```
          files: |
            casc-extractor-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz
            casc-extractor-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
